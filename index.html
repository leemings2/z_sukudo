<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>數獨</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: board on the left, controls panel on the right (stacked on phones). Ink-on-graph-paper feel. */
:root {
  --bg: #eceff4;
  --paper: #fbfcfe;
  --ink: #1b2233;
  --ink-soft: #5b6478;
  --line: #c9cfdb;
  --accent: #2d52d4;
  --accent-ink: #ffffff;
  --peer: #e5e9f5;
  --same: #c9d5fa;
  --err: #d0314a;
  --err-bg: #fbe3e7;
  --hint: #a4640c;
  --font-display: "Bricolage Grotesque", "Noto Sans TC", system-ui, sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-digit: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141b; --paper: #191d27; --ink: #e8ebf3; --ink-soft: #9aa3b8; --line: #373e50;
    --accent: #8ba5ff; --accent-ink: #0d1220; --peer: #232938; --same: #31416f;
    --err: #ff7a8e; --err-bg: #4a2630; --hint: #f0b35a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141b; --paper: #191d27; --ink: #e8ebf3; --ink-soft: #9aa3b8; --line: #373e50;
  --accent: #8ba5ff; --accent-ink: #0d1220; --peer: #232938; --same: #31416f;
  --err: #ff7a8e; --err-bg: #4a2630; --hint: #f0b35a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; max-width: 540px; width: 100%; margin: 0 auto; }
.play { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; justify-content: center; }
@media (min-width: 860px) {
  .app { align-items: center; }
  .top { max-width: 920px; }
  .play { grid-template-columns: minmax(0, 540px) 320px; gap: 40px; align-items: start; }
}
h1 { font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: 0.04em; margin: 0; line-height: 1; }
.stats { display: flex; gap: 14px; align-items: baseline; font-family: var(--font-digit); font-size: 15px; color: var(--ink-soft); }
.stats #time { color: var(--ink); font-size: 20px; font-variant-numeric: tabular-nums; min-width: 4.2ch; text-align: right; }

.pausebtn { min-height: 34px; padding: 0 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 17px; font-size: 13px; font-weight: 500; }
.pausebtn:hover { border-color: var(--accent); }
.pausebtn:disabled { opacity: 0.45; cursor: default; }
#pause { background: var(--paper); border: 2px solid var(--ink); z-index: 2; }
.board-wrap { position: relative; width: 100%; max-width: 540px; margin: 0 auto; }
.board {
  container-type: inline-size;
  display: grid; grid-template-columns: repeat(9, 1fr); aspect-ratio: 1; width: 100%;
  background: var(--paper); border: 2px solid var(--ink); border-radius: 4px; overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
.cell {
  position: relative; display: flex; align-items: center; justify-content: center;
  background: transparent; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  padding: 0; min-width: 0; min-height: 0; border-radius: 0;
  font-family: var(--font-digit); font-weight: 500; font-size: clamp(16px, 6vw, 32px); font-size: 5.8cqw; color: var(--accent);
}
.cell.br { border-right: 2px solid var(--ink); }
.cell.bb { border-bottom: 2px solid var(--ink); }
.cell:nth-child(9n) { border-right: 0; }
.cell:nth-child(n+73) { border-bottom: 0; }
.cell.given { color: var(--ink); font-weight: 500; }
.cell.hint { color: var(--hint); }
.cell.peer { background: var(--peer); }
.cell.same { background: var(--same); }
.cell.err { background: var(--err-bg); color: var(--err); }
.cell.sel { background: var(--same); box-shadow: inset 0 0 0 3px var(--accent); }
.cell:focus-visible { outline: none; }
.notes { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 100%; height: 100%; padding: 6%; color: var(--ink-soft); font-size: 2.6cqw; font-size: clamp(7px, 2.6cqw, 14px); line-height: 1; }
.notes i { display: flex; align-items: center; justify-content: center; font-style: normal; }

.win {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  background: color-mix(in srgb, var(--paper) 92%, transparent); border-radius: 4px; text-align: center; padding: 16px;
}
.win h2 { font-family: var(--font-display); font-size: 40px; margin: 0; letter-spacing: 0.05em; }
.win p { margin: 0; color: var(--ink-soft); }

.panel { display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: 540px; margin: 0 auto; }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tool {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 56px; padding: 6px 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; font-weight: 500;
}
.tool small { font-family: var(--font-digit); font-size: 11px; color: var(--ink-soft); }
.tool:hover { border-color: var(--accent); }
.tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tool[aria-pressed="true"] small { color: var(--accent-ink); }
.tool:disabled { opacity: 0.45; cursor: default; }

.pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
@media (min-width: 860px) { .pad { grid-template-columns: repeat(3, 1fr); gap: 8px; } }
.num {
  position: relative; display: flex; align-items: center; justify-content: center; aspect-ratio: 1 / 1.15;
  background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
  font-family: var(--font-digit); font-size: 22px; font-weight: 500; color: var(--accent); padding: 0;
}
@media (min-width: 860px) { .num { aspect-ratio: 1.5 / 1; font-size: 26px; } }
.num:hover { border-color: var(--accent); }
.num .left { position: absolute; right: 5px; bottom: 3px; font-size: 10px; color: var(--ink-soft); font-weight: 400; }
.num:disabled { opacity: 0.35; cursor: default; }

.label { font-size: 12px; letter-spacing: 0.12em; color: var(--ink-soft); margin-bottom: 8px; }
.lvs { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; margin-bottom: 10px; }
.lv {
  min-height: 40px; padding: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
  font-family: var(--font-digit); font-size: 15px;
}
.lv[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lv-name { font-size: 13px; color: var(--ink-soft); margin: 0 0 12px; min-height: 1.4em; }
.primary {
  width: 100%; min-height: 48px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 16px; letter-spacing: 0.05em;
}
.primary:disabled { opacity: 0.6; cursor: wait; }
.msg { min-height: 1.5em; margin: 0; font-size: 13px; color: var(--ink-soft); }
.keys { margin: 0; font-size: 12px; color: var(--ink-soft); line-height: 1.7; }
.keys kbd { font-family: var(--font-digit); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
@media (max-width: 859px) { .keys { display: none; } }
@media (prefers-reduced-motion: no-preference) { .cell, .tool, .num, .lv { transition: background-color .12s, border-color .12s; } }
</style>

</head>
<body>
<main class="app">
  <header class="top">
    <h1>數獨</h1>
    <div class="stats"><span id="lvTag">Lv 3</span><span id="time">00:00</span><button id="pauseBtn" type="button" class="pausebtn">暫停</button></div>
  </header>
  <section class="play">
    <div class="board-wrap">
      <div id="board" class="board" role="grid" aria-label="數獨盤面"></div>
      <div id="win" class="win" hidden>
        <h2>完成!</h2>
        <p id="winInfo"></p>
        <button id="winBtn" type="button" class="primary" style="max-width:260px"></button>
      </div>
      <div id="pause" class="win" hidden>
        <h2>已暫停</h2>
        <p>計時已停止,盤面已隱藏</p>
        <button id="resumeBtn" type="button" class="primary" style="max-width:260px">繼續 <span style="opacity:.7">(P)</span></button>
      </div>
    </div>
    <aside class="panel">
      <div class="tools">
        <button id="undoBtn" type="button" class="tool">返回<small>Z</small></button>
        <button id="hintBtn" type="button" class="tool">提示<small id="hintCount">已用 0</small></button>
        <button id="eraseBtn" type="button" class="tool">清除<small>Del</small></button>
        <button id="noteBtn" type="button" class="tool" aria-pressed="false">筆記<small id="noteState">關</small></button>
      </div>
      <div id="pad" class="pad"></div>
      <div>
        <div class="label">難度 LEVEL</div>
        <div id="lvs" class="lvs"></div>
        <p id="lvName" class="lv-name"></p>
        <button id="newBtn" type="button" class="primary"></button>
      </div>
      <p id="msg" class="msg" aria-live="polite"></p>
      <p class="keys"><kbd>1-9</kbd> 填數字 · <kbd>方向鍵</kbd> 移動 · <kbd>Z</kbd> 返回 · <kbd>H</kbd> 提示 · <kbd>N</kbd> 筆記模式 · <kbd>P</kbd> 暫停</p>
    </aside>
  </section>
</main>

<script>
//GEN-START
const PEERS = [];
for (let i = 0; i < 81; i++) {
  const r = (i / 9) | 0, c = i % 9, set = new Set();
  for (let k = 0; k < 9; k++) { set.add(r * 9 + k); set.add(k * 9 + c); }
  const br = r - (r % 3), bc = c - (c % 3);
  for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) set.add((br + a) * 9 + bc + b);
  set.delete(i);
  PEERS.push([...set]);
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function search(g, limit, randomize) {
  const rm = new Array(9).fill(0), cm = new Array(9).fill(0), bm = new Array(9).fill(0);
  const a = g.slice();
  for (let i = 0; i < 81; i++) if (a[i]) { const b = 1 << a[i]; rm[(i / 9) | 0] |= b; cm[i % 9] |= b; bm[(((i / 9) | 0) / 3 | 0) * 3 + ((i % 9) / 3 | 0)] |= b; }
  let count = 0, first = null;
  (function rec() {
    let best = -1, bestMask = 0, bestN = 10;
    for (let i = 0; i < 81; i++) {
      if (a[i]) continue;
      const r = (i / 9) | 0, c = i % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0);
      const m = ~(rm[r] | cm[c] | bm[b]) & 0x3fe;
      let n = 0; for (let x = m; x; x &= x - 1) n++;
      if (n < bestN) { bestN = n; best = i; bestMask = m; if (n <= 1) break; }
    }
    if (best < 0) { count++; if (!first) first = a.slice(); return; }
    if (bestN === 0) return;
    const r = (best / 9) | 0, c = best % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0);
    const ds = []; for (let d = 1; d <= 9; d++) if (bestMask & (1 << d)) ds.push(d);
    if (randomize) shuffle(ds);
    for (const d of ds) {
      const bit = 1 << d;
      a[best] = d; rm[r] |= bit; cm[c] |= bit; bm[b] |= bit;
      rec();
      a[best] = 0; rm[r] &= ~bit; cm[c] &= ~bit; bm[b] &= ~bit;
      if (count >= limit) return;
    }
  })();
  return { count, first };
}
// target number of clues left on the board for each level (level 9 digs until no more can be removed)
const CLUES = [49, 43, 38, 34, 31, 29, 27, 25, 17];
function generate1(level) {
  const solution = search(new Array(81).fill(0), 1, true).first;
  const puzzle = solution.slice();
  let clues = 81;
  const target = CLUES[level - 1];
  for (const idx of shuffle([...Array(81).keys()])) {
    if (clues <= target) break;
    const keep = puzzle[idx];
    puzzle[idx] = 0;
    if (search(puzzle, 2, false).count !== 1) puzzle[idx] = keep; else clues--;
  }
  return { puzzle, solution, clues };
}
function generate(level) {
  if (level < 9) return generate1(level);
  let best = null; // level 9: keep the sparsest of several attempts
  for (let k = 0; k < 40; k++) { const g = generate1(9); if (!best || g.clues < best.clues) best = g; }
  return best;
}
//GEN-END

const NAMES = ['入門', '簡單', '輕鬆', '普通', '進階', '困難', '專家', '大師', '極限'];
const SAVE_KEY = 'sudoku-save-v1';
const $ = s => document.querySelector(s);
const boardEl = $('#board');
let S = null, nextLevel = 3, busy = false;

// ---- build static UI
const cells = [];
for (let i = 0; i < 81; i++) {
  const r = (i / 9) | 0, c = i % 9;
  const el = document.createElement('button');
  el.type = 'button';
  el.setAttribute('role', 'gridcell');
  el.dataset.base = 'cell' + (c % 3 === 2 && c < 8 ? ' br' : '') + (r % 3 === 2 && r < 8 ? ' bb' : '');
  el.addEventListener('click', () => { if (S && !S.paused) { S.sel = i; render(); } });
  boardEl.appendChild(el);
  cells.push(el);
}
const padEl = $('#pad'), padBtns = [];
for (let d = 1; d <= 9; d++) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'num';
  b.innerHTML = d + '<span class="left"></span>';
  b.addEventListener('click', () => setNum(d));
  padEl.appendChild(b); padBtns.push(b);
}
const lvsEl = $('#lvs'), lvBtns = [];
for (let l = 1; l <= 9; l++) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'lv'; b.textContent = l;
  b.setAttribute('aria-label', '難度 ' + l + ' ' + NAMES[l - 1]);
  b.addEventListener('click', () => { nextLevel = l; renderLevels(); });
  lvsEl.appendChild(b); lvBtns.push(b);
}
function renderLevels() {
  lvBtns.forEach((b, k) => b.setAttribute('aria-pressed', String(k + 1 === nextLevel)));
  $('#lvName').textContent = 'Lv ' + nextLevel + ' ' + NAMES[nextLevel - 1] + ' · 約 ' + CLUES[nextLevel - 1] + (nextLevel === 9 ? ' 格以下(最少提示)' : ' 格提示數字');
  $('#newBtn').textContent = busy ? '產生題目中…' : '開新局 · Lv ' + nextLevel;
  $('#newBtn').disabled = busy;
}

// ---- state helpers
function fmt(s) { const m = Math.floor(s / 60), x = s % 60; return String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); }
function msg(t) { $('#msg').textContent = t || ''; }
function pos(i) { return '第 ' + (((i / 9) | 0) + 1) + ' 列第 ' + ((i % 9) + 1) + ' 行'; }
function conflict(i) { const v = S.vals[i]; if (!v) return false; for (const p of PEERS[i]) if (S.vals[p] === v) return true; return false; }
function locked(i) { return S.given[i] || S.hinted[i]; }
function save() {
  if (!S) return;
  try {
    if (S.done) localStorage.removeItem(SAVE_KEY);
    else localStorage.setItem(SAVE_KEY, JSON.stringify({ ...S, hist: S.hist.slice(-150) }));
  } catch (e) {}
}
function push() {
  S.hist.push({ v: S.vals.slice(), n: S.notes.slice(), h: S.hinted.slice() });
  if (S.hist.length > 400) S.hist.shift();
}

// ---- render
function render() {
  const sel = S.sel, sv = sel >= 0 ? S.vals[sel] : 0;
  for (let i = 0; i < 81; i++) {
    const v = S.vals[i];
    let cls = cells[i].dataset.base;
    if (S.given[i]) cls += ' given'; else if (S.hinted[i]) cls += ' hint';
    if (i === sel) cls += ' sel';
    else if (sv && v === sv) cls += ' same';
    else if (sel >= 0 && PEERS[sel].includes(i)) cls += ' peer';
    if (v && conflict(i)) cls += ' err';
    cells[i].className = cls;
    let html;
    if (v) html = String(v);
    else if (S.notes[i]) {
      html = '<span class="notes">';
      for (let d = 1; d <= 9; d++) html += '<i>' + (S.notes[i] & (1 << d) ? d : '') + '</i>';
      html += '</span>';
    } else html = '';
    if (cells[i].innerHTML !== html) cells[i].innerHTML = html;
    cells[i].setAttribute('aria-label', pos(i) + (v ? ' ' + v : ' 空格'));
  }
  for (let d = 1; d <= 9; d++) {
    let n = 0; for (let i = 0; i < 81; i++) if (S.vals[i] === d && S.solution[i] === d) n++;
    padBtns[d - 1].disabled = n >= 9 || S.done;
    padBtns[d - 1].querySelector('.left').textContent = 9 - n > 0 ? 9 - n : '';
  }
  $('#lvTag').textContent = 'Lv ' + S.level + ' · ' + NAMES[S.level - 1];
  $('#time').textContent = fmt(S.seconds);
  $('#hintCount').textContent = '已用 ' + S.hints;
  $('#undoBtn').disabled = !S.hist.length || S.done;
  $('#hintBtn').disabled = S.done;
  $('#eraseBtn').disabled = S.done;
  $('#noteBtn').setAttribute('aria-pressed', String(S.noteMode));
  $('#noteState').textContent = S.noteMode ? '開' : '關';
  $('#win').hidden = !S.done;
  $('#pause').hidden = !S.paused || S.done;
  $('#pauseBtn').textContent = S.paused ? '繼續' : '暫停';
  $('#pauseBtn').disabled = S.done;
  if (S.paused) ['undoBtn', 'hintBtn', 'eraseBtn', 'noteBtn'].forEach(id => $('#' + id).disabled = true);
  if (S.paused) padBtns.forEach(b => b.disabled = true);
}

// ---- actions
function afterMove() {
  if (S.vals.every((v, i) => v === S.solution[i])) {
    S.done = true; S.sel = -1;
    const nl = Math.min(9, S.level + 1);
    $('#winInfo').textContent = '用時 ' + fmt(S.seconds) + ' · 使用提示 ' + S.hints + ' 次';
    $('#winBtn').textContent = S.level < 9 ? '挑戰 Lv ' + nl : '再來一局 Lv 9';
    $('#winBtn').onclick = () => { nextLevel = nl; renderLevels(); newGame(nl); };
  }
  render(); save();
}
function setNum(d) {
  if (S && S.paused) return;
  if (!S || S.done || S.sel < 0) { if (S && !S.done) msg('先點選一個空格'); return; }
  const i = S.sel;
  if (locked(i)) { msg('這格是固定的數字'); return; }
  if (S.noteMode) {
    if (S.vals[i]) return;
    push(); S.notes[i] ^= (1 << d);
  } else {
    push();
    if (S.vals[i] === d) S.vals[i] = 0;
    else {
      S.vals[i] = d; S.notes[i] = 0;
      for (const p of PEERS[i]) S.notes[p] &= ~(1 << d);
    }
  }
  msg(''); afterMove();
}
function erase() {
  if (!S || S.done || S.paused || S.sel < 0) return;
  const i = S.sel;
  if (locked(i) || (!S.vals[i] && !S.notes[i])) return;
  push(); S.vals[i] = 0; S.notes[i] = 0; afterMove();
}
function undo() {
  if (!S || S.done || S.paused) return;
  const h = S.hist.pop();
  if (!h) { msg('沒有可以返回的步驟'); return; }
  S.vals = h.v; S.notes = h.n; S.hinted = h.h; msg('已返回上一步'); render(); save();
}
function hint() {
  if (!S || S.done || S.paused) return;
  let t = -1;
  const i = S.sel;
  if (i >= 0 && !locked(i) && S.vals[i] !== S.solution[i]) t = i;
  else {
    const empty = [], bad = [];
    for (let k = 0; k < 81; k++) if (!locked(k) && S.vals[k] !== S.solution[k]) (S.vals[k] ? bad : empty).push(k);
    const pool = empty.length ? empty : bad;
    if (!pool.length) return;
    t = pool[Math.floor(Math.random() * pool.length)];
  }
  push();
  S.vals[t] = S.solution[t]; S.notes[t] = 0; S.hinted[t] = true;
  for (const p of PEERS[t]) S.notes[p] &= ~(1 << S.solution[t]);
  S.hints++; S.sel = t;
  msg('提示:' + pos(t) + ' 是 ' + S.solution[t]);
  afterMove();
}
function newGame(level) {
  if (busy) return;
  busy = true; renderLevels(); msg('');
  setTimeout(() => {
    const g = generate(level);
    S = {
      level, puzzle: g.puzzle, solution: g.solution,
      vals: g.puzzle.slice(), notes: new Array(81).fill(0),
      given: g.puzzle.map(v => v > 0), hinted: new Array(81).fill(false),
      sel: -1, paused: false, noteMode: false, hist: [], seconds: 0, hints: 0, done: false
    };
    S.sel = S.vals.indexOf(0);
    busy = false; renderLevels(); render(); save();
  }, 30);
}

function togglePause() {
  if (!S || S.done) return;
  S.paused = !S.paused; msg(S.paused ? '' : '繼續計時'); render(); save();
}
$('#pauseBtn').addEventListener('click', togglePause);
$('#resumeBtn').addEventListener('click', togglePause);
$('#undoBtn').addEventListener('click', undo);
$('#hintBtn').addEventListener('click', hint);
$('#eraseBtn').addEventListener('click', erase);
$('#noteBtn').addEventListener('click', () => { if (S) { S.noteMode = !S.noteMode; render(); } });
$('#newBtn').addEventListener('click', () => newGame(nextLevel));

document.addEventListener('keydown', e => {
  if (!S || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k.toLowerCase() === 'p' && !e.ctrlKey && !S.done) { togglePause(); return; }
  if (S.paused) return;
  if ((e.ctrlKey) && k.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.ctrlKey) return;
  if (/^[1-9]$/.test(k)) { setNum(+k); return; }
  if (k === 'Backspace' || k === 'Delete' || k === '0') { e.preventDefault(); erase(); return; }
  const lk = k.toLowerCase();
  if (lk === 'z') undo(); else if (lk === 'h') hint(); else if (lk === 'n') { S.noteMode = !S.noteMode; render(); }
  else if (k.startsWith('Arrow')) {
    e.preventDefault();
    let s = S.sel < 0 ? 40 : S.sel, r = (s / 9) | 0, c = s % 9;
    if (k === 'ArrowUp') r = (r + 8) % 9; else if (k === 'ArrowDown') r = (r + 1) % 9;
    else if (k === 'ArrowLeft') c = (c + 8) % 9; else c = (c + 1) % 9;
    S.sel = r * 9 + c; render();
  }
});

setInterval(() => {
  if (!S || S.done || S.paused || document.hidden) return;
  S.seconds++; $('#time').textContent = fmt(S.seconds);
  if (S.seconds % 5 === 0) save();
}, 1000);

// ---- start: resume saved game or begin a new one
(function boot() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && ['vals', 'notes', 'given', 'hinted', 'solution'].every(k => Array.isArray(d[k]) && d[k].length === 81) && !d.done) {
        S = d; S.paused = false; S.hist = Array.isArray(d.hist) ? d.hist : [];
        nextLevel = S.level; renderLevels(); render(); msg('已接續上次的棋局'); return;
      }
    }
  } catch (e) {}
  renderLevels(); newGame(nextLevel);
})();
</script>
